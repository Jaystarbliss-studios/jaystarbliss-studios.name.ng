    <script>
        const savedTheme = localStorage.getItem('jdh-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        
        window.toggleTheme = function() {
            const h = document.documentElement;
            const isDark = h.getAttribute('data-theme') === 'dark';
            const n = isDark ? 'light' : 'dark';
            h.setAttribute('data-theme', n);
            localStorage.setItem('jdh-theme', n);
            if (n === 'dark') h.classList.add('dark'); else h.classList.remove('dark');
        };
    </script>

<body>
  <div>
    <h1>School Admin Portal</h1>
    <p>Loading your dashboard...</p>
  </div>
  <script type="module">
    import { db, auth, requireAuth } from '../../assets/js/jdh-firebase-modules.js';
    import { collection, query, where, getDocs, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    // Check if user is school admin
    requireAuth('schoolAdmin', '../auth/login.html').then(async () => {
      document.querySelector('div').innerHTML = `
        <div style="text-align: left; background: #1a1a1f; padding: 2rem; border-radius: 8px;">
          <h2 style="color: #bb86fc;">School Dashboard</h2>
          <div style="margin-bottom: 2rem;">
            <h3>Create Student</h3>
            <form id="createStudentForm">
              <input type="text" id="sName" placeholder="Student Name" required style="padding: 0.5rem; margin-bottom: 0.5rem; width: 100%;">
              <input type="email" id="sEmail" placeholder="Student Email" required style="padding: 0.5rem; margin-bottom: 0.5rem; width: 100%;">
              <input type="text" id="sCode" placeholder="Access Code (temp)" required style="padding: 0.5rem; margin-bottom: 1rem; width: 100%;">
              <button type="submit" style="padding: 0.5rem 1rem; background: #bb86fc; color: #000; border: none; cursor: pointer;">Create Student</button>
            </form>
          </div>
          
          <div>
            <h3>Your Students</h3>
            <ul id="studentList">Loading...</ul>
          </div>
        </div>
      `;
      
      const uid = localStorage.getItem('userId');
      let schoolId = null;
      
      // Get School ID for this admin
      const adminSnap = await getDocs(query(collection(db, 'schoolAdmins'), where('uid', '==', uid)));
      if (!adminSnap.empty) {
        schoolId = adminSnap.docs[0].data().schoolId;
      }
      
      if (!schoolId) {
        document.getElementById('studentList').innerHTML = '<li>Error: No school linked to this admin account.</li>';
        return;
      }
      
      // Load Students
      const loadStudents = async () => {
        const list = document.getElementById('studentList');
        const sSnap = await getDocs(query(collection(db, 'students'), where('schoolId', '==', schoolId)));
        if (sSnap.empty) {
          list.innerHTML = '<li>No students found.</li>';
        } else {
          list.innerHTML = '';
          sSnap.forEach(d => {
            const data = d.data();
            list.innerHTML += `<li>${data.name || data.fullName} (${data.email})</li>`;
          });
        }
      };
      
      loadStudents();
      
      // Handle Student Creation
      document.getElementById('createStudentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('sName').value;
        const email = document.getElementById('sEmail').value.toLowerCase();
        const accessCode = document.getElementById('sCode').value;
        
        try {
          await addDoc(collection(db, 'students'), {
            name: name,
            fullName: name,
            email: email,
            accessCode: accessCode,
            studentType: 'school',
            authType: 'accessCode',
            schoolId: schoolId,
            createdAt: serverTimestamp()
          });
          alert('Student created successfully');
          document.getElementById('createStudentForm').reset();
          loadStudents();
        } catch(err) {
          alert('Failed to create student: ' + err.message);
        }
      });
    });
  </script>

<script>
window.switchTab = function(name, btn) {
    console.log("Switching to tab:", name);
    document.querySelectorAll('.sidebar-menu .nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.tab-pane, .tab-content').forEach(p => p.classList.remove('active'));
    
    let targetBtn = btn || document.querySelector('.sidebar-menu .nav-item[data-tab="' + name + '"]');
    if(targetBtn) targetBtn.classList.add('active');
    
    // Some buttons might pass data-tab="null" but pass 'name' as first argument.
    // We try to find the button by onclick if we couldn't find it
    if(!targetBtn) {
        let allBtns = document.querySelectorAll('.sidebar-menu .nav-item');
        for(let i=0; i<allBtns.length; i++) {
            let attr = allBtns[i].getAttribute('onclick') || '';
            if(attr.includes("'" + name + "'")) {
                allBtns[i].classList.add('active');
                break;
            }
        }
    }
    
    const pane = document.getElementById(name);
    if(pane) pane.classList.add('active');
    
    document.querySelector('main')?.scrollTo(0, 0);
};
window.toggleSidebar = function() {
    const sb = document.getElementById('sidebar');
    if(sb) sb.classList.toggle('-translate-x-full');
};
</script>
