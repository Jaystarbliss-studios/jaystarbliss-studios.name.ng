<script>
  (function() {
    const t = localStorage.getItem('jdh-theme');
    if (t === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.setAttribute('data-theme', 'dark'); }
    else if (t === 'light') { document.documentElement.classList.remove('dark'); document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>

<script>
  // Session Timeout Logic (2 hours)
  (function() {
    let inactivityTimer;
    const timeoutDuration = 2 * 60 * 60 * 1000; // 2 hours
    
    function resetTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(logoutDueToInactivity, timeoutDuration);
    }
    
    function logoutDueToInactivity() {
      localStorage.clear();
      alert('Your session has expired due to inactivity. Please log in again.');
      window.location.href = '../auth/login.html';
    }
    
    window.addEventListener('mousemove', resetTimer);
    window.addEventListener('keypress', resetTimer);
    window.addEventListener('click', resetTimer);
    window.addEventListener('scroll', resetTimer);
    
    resetTimer(); // Initialize
    
    window.globalPerformLogout = async function() {
        if (typeof window._doLogout === 'function') { await window._doLogout(); return; }
        if (typeof window.doLogout === 'function') { await window.doLogout(); return; }
        
        try {
           const { getAuth, signOut } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
           await signOut(getAuth());
        } catch (e) {}
        
        localStorage.clear();
        window.location.href = '../auth/login.html';
    };
  })();
</script>

    <script>
        const savedTheme = localStorage.getItem('jdh-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        
        window.toggleTheme = function() {
            const h = document.documentElement;
            const isDark = h.getAttribute('data-theme') === 'dark';
            const n = isDark ? 'light' : 'dark';
            h.setAttribute('data-theme', n);
            localStorage.setItem('jdh-theme', n);
            if (n === 'dark') h.classList.add('dark'); else h.classList.remove('dark');
        };
    </script>

<body>

  <div class="container">
    <div class="card">

        <thead><tr><th>Student</th><th>Subject</th><th>Status</th><th>Actions</th></tr></thead>

      </table>
    </div>
    <div class="card">

      <button onclick="document.getElementById('assignmentForm').style.display='block'">+ New Assignment</button>
      <div id="assignmentForm" style="display:none; margin-top:1rem;">
        <select id="aStudentId"><option value="">Select Student</option></select><br><br>
        <input type="text" id="aTitle" placeholder="Title"><br><br>
        <textarea id="aDesc" placeholder="Description"></textarea><br><br>
        <button onclick="createAssignment()">Save</button>
      </div>
      <table id="assignmentsTable" style="margin-top:1rem;">

    </div>
    
    <div class="card">
      <h3>Messages</h3>

    <div class="card">
      <h3>Student Progress</h3>
      <button onclick="document.getElementById('progressForm').style.display='block'">+ Update Progress</button>
      <div id="progressForm" style="display:none; margin-top:1rem;">
        <select id="pStudentId"><option value="">Select Student</option></select><br><br>
        <input type="number" id="pCompletion" placeholder="Completion %"><br><br>
        <input type="number" id="pPerformance" placeholder="Performance %"><br><br>
        <textarea id="pNotes" placeholder="Notes"></textarea><br><br>
        <button onclick="updateProgress()">Save</button>
      </div>
      <table id="progressTable" style="margin-top:1rem;">
        <thead><tr><th>Student ID</th><th>Completion</th><th>Performance</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

  <script type="module">

    import { db, requireAuth } from '../../assets/js/jdh-firebase-modules.js';
    import { collection, query, where, getDocs, addDoc, serverTimestamp, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

import '../../assets/js/phase_a_tutor.js';

    import { setupNotifications } from '../../assets/js/jdh-firebase-modules.js';
    const tUid = localStorage.getItem('userId');
    if(tUid) {
        setupNotifications(tUid, 'notifBell', 'notifBadge', 'notifPanel', 'notifContent');
        // Override the slide out logic for simple display
        document.getElementById('notifBell').addEventListener('click', () => {
            document.getElementById('notifPanel').style.display = 'block';
        });
    }
    


    let myUid = null;
    let myStudents = [];

    async function init() {
      await requireAuth('tutor', '../auth/login.html');
      myUid = localStorage.getItem('userId');
      loadStudents();
      loadAssignments();
      loadProgress();
    }

    async function loadStudents() {
      const tbody = document.querySelector('#studentsTable tbody');
      try {
        const snap = await getDocs(query(collection(db, 'students'), where('tutorId', '==', myUid)));
        tbody.innerHTML = '';
        myStudents = [];
        const studentSelects = [document.getElementById('aStudentId'), document.getElementById('pStudentId')];
        studentSelects.forEach(sel => sel.innerHTML = '<option value="">Select Student</option>');
        
        snap.forEach(d => {
          const data = d.data();
          myStudents.push({ id: d.id, ...data });
          tbody.innerHTML += `<tr>
            <td>${data.name || data.fullName}</td>
            <td>${data.subjects ? data.subjects.join(', ') : 'N/A'}</td>
            <td>Active</td>
            <td>
        <button onclick="window.openChat('${d.id}')">Message</button>
        <button onclick="window.viewStudentDetails('${d.id}')">View Details</button>
    </td>
          </tr>`;
          
          studentSelects.forEach(sel => {
            if (sel.tagName === 'SELECT') {
              sel.innerHTML += `<option value="${d.id}">${data.name || data.fullName}</option>`;
            } else {
               // In case it's still an input
               // Actually we will replace the inputs with selects in the DOM later
            }
          });
        });
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="4">Error loading students</td></tr>';
      }
    }

    async function loadAssignments() {
      const tbody = document.querySelector('#assignmentsTable tbody');
      try {
        const snap = await getDocs(query(collection(db, 'assignments'), where('tutorId', '==', myUid)));
        tbody.innerHTML = '';
        snap.forEach(d => {
          const data = d.data();
          const student = myStudents.find(s => s.id === data.studentId);
          tbody.innerHTML += `<tr>
            <td>${student ? student.name : data.studentId}</td>
            <td>${data.title}</td>
            <td>${data.status}</td>
          </tr>`;
        });
      } catch(e) {}
    }

    async function loadProgress() {
      const tbody = document.querySelector('#progressTable tbody');
      try {
        const snap = await getDocs(query(collection(db, 'progress'), where('tutorId', '==', myUid)));
        tbody.innerHTML = '';
        snap.forEach(d => {
          const data = d.data();
          const student = myStudents.find(s => s.id === data.studentId);
          tbody.innerHTML += `<tr>
            <td>${student ? student.name : data.studentId}</td>
            <td>${data.completionPercentage}%</td>
            <td>${data.performanceScore}%</td>
          </tr>`;
        });
      } catch(e) {}
    }

    window.createAssignment = async function() {
      const studentId = document.getElementById('aStudentId').value;
      const title = document.getElementById('aTitle').value;
      const desc = document.getElementById('aDesc').value;
      
      if (!studentId || !title) return alert('Fill required fields');
      
      try {
        await addDoc(collection(db, 'assignments'), {
          tutorId: myUid,
          studentId,
          title,
          description: desc,
          status: 'active',
          createdAt: serverTimestamp()
        });
        document.getElementById('assignmentForm').style.display='none';
        loadAssignments();
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }

    window.updateProgress = async function() {
      const studentId = document.getElementById('pStudentId').value;
      const completion = document.getElementById('pCompletion').value;
      const performance = document.getElementById('pPerformance').value;
      const notes = document.getElementById('pNotes').value;
      
      if (!studentId || !completion || !performance) return alert('Fill required fields');
      
      try {
        await addDoc(collection(db, 'progress'), {
          tutorId: myUid,
          studentId,
          completionPercentage: Number(completion),
          performanceScore: Number(performance),
          notes,
          updatedAt: serverTimestamp()
        });
        document.getElementById('progressForm').style.display='none';
        loadProgress();
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }
    
    
    import { onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    let currentConvId = null;

    window.openChat = async function(studentId) {
      // Find or create conversation with this student's parent/student
      const student = myStudents.find(s => s.id === studentId);
      if (!student) return;
      
      const parentId = student.parentId;
      if (!parentId) {
        alert("This student doesn't have a parent linked. Chatting directly with student is not yet fully configured.");
        return;
      }
      
      try {
        // Find existing conv
        const snap = await getDocs(query(collection(db, 'conversations'), where('participants', 'array-contains', myUid)));
        let convId = null;
        snap.forEach(d => {
          const data = d.data();
          if (data.participants.includes(parentId)) {
            convId = d.id;
          }
        });
        
        if (!convId) {
          const ref = await addDoc(collection(db, 'conversations'), {
            participants: [myUid, parentId],
            subject: 'Chat about ' + student.name,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          convId = ref.id;
        }
        
        loadMessages(convId, 'Chat about ' + student.name, parentId);
      } catch(e) {
        alert('Error opening chat: ' + e.message);
      }
    };

    function loadMessages(convId, subject, recipientId) {
      currentConvId = convId;
      const view = document.getElementById('msgView');
      view.innerHTML = '<div style="padding:1rem;">Loading...</div>';
      
      const q = query(collection(db, 'messages'), where('conversationId', '==', convId));
      // orderby requires index, in phase 7 we just use onSnapshot and sort in client or create index
      onSnapshot(q, (snap) => {
        if (currentConvId !== convId) return;
        
        const msgs = [];
        snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
        msgs.sort((a,b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
        
        let html = `<h4 style="margin: 0 0 1rem 0; padding:1rem; border-bottom:1px solid #eee;">${subject}</h4>
        <div style="flex:1; overflow-y:auto; padding:1rem; background:#fafafa;">`;
        
        msgs.forEach(msg => {
          const isMe = msg.senderId === myUid;
          html += `
            <div style="margin-bottom:0.5rem; text-align:${isMe ? 'right' : 'left'}">
              <span style="display:inline-block; padding:0.5rem 1rem; border-radius:1rem; background:${isMe ? '#ab1a0d' : '#e5e7eb'}; color:${isMe ? '#fff' : '#000'};">
                ${msg.text}
              </span>
            </div>
          `;
        });
        
        html += `</div>
        <div style="display:flex; padding:1rem; border-top:1px solid #eee;">
          <input type="text" id="tutorMsgInput" style="flex:1; padding:0.5rem; border:1px solid #ccc; border-radius:4px;" placeholder="Type reply...">
          <button style="margin-left:0.5rem;" onclick="sendTutorMsg('${convId}', '${recipientId}')">Send</button>
        </div>`;
        
        view.innerHTML = html;
      });
    }

    window.sendTutorMsg = async function(convId, recipientId) {
      const input = document.getElementById('tutorMsgInput');
      const text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      try {
        await addDoc(collection(db, 'messages'), {
          conversationId: convId,
          senderId: myUid,
          recipientId: recipientId,
          text: text,
          createdAt: serverTimestamp(),
          read: false
        });
        await updateDoc(doc(db, 'conversations', convId), { updatedAt: serverTimestamp() });
      } catch(e) {
        alert('Send failed: ' + e.message);
      }
    };


    init();

</script>

    <!-- Slide-out Notifications Panel -->
    <div id="notifPanel" class="active" style="display:none; position:fixed; right:0; top:0; width:300px; height:100%; background:white; z-index:1000; box-shadow:-2px 0 5px rgba(0,0,0,0.2); overflow-y:auto;">
        <div style="padding:15px; border-bottom:1px solid #ccc; display:flex; justify-content:space-between;">
            <h3>Notifications</h3>
            <button onclick="document.getElementById('notifPanel').style.display='none'">Close</button>
        </div>
        <div id="notifContent" style="padding:15px;"></div>
    </div>
    

<script>
window.switchTab = function(name, btn) {
    console.log("Switching to tab:", name);
    document.querySelectorAll('.sidebar-menu .nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.tab-pane, .tab-content').forEach(p => p.classList.remove('active'));
    
    let targetBtn = btn || document.querySelector('.sidebar-menu .nav-item[data-tab="' + name + '"]');
    if(targetBtn) targetBtn.classList.add('active');
    
    // Some buttons might pass data-tab="null" but pass 'name' as first argument.
    // We try to find the button by onclick if we couldn't find it
    if(!targetBtn) {
        let allBtns = document.querySelectorAll('.sidebar-menu .nav-item');
        for(let i=0; i<allBtns.length; i++) {
            let attr = allBtns[i].getAttribute('onclick') || '';
            if(attr.includes("'" + name + "'")) {
                allBtns[i].classList.add('active');
                break;
            }
        }
    }
    
    const pane = document.getElementById(name);
    if(pane) pane.classList.add('active');
    
    document.querySelector('main')?.scrollTo(0, 0);
};
window.toggleSidebar = function() {
    const sb = document.getElementById('sidebar');
    if(sb) sb.classList.toggle('-translate-x-full');
};
</script>
