    <script>
        const savedTheme = localStorage.getItem('jdh-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        
        window.toggleTheme = function() {
            const h = document.documentElement;
            const isDark = h.getAttribute('data-theme') === 'dark';
            const n = isDark ? 'light' : 'dark';
            h.setAttribute('data-theme', n);
            localStorage.setItem('jdh-theme', n);
            if (n === 'dark') h.classList.add('dark'); else h.classList.remove('dark');
        };
    </script>

<body>
  <div class="checkout-box">
    <div class="paystack-logo">paystack (Simulated)</div>
    <h2>Complete Payment</h2>
    <div class="amount" id="amountDisplay">Loading...</div>
    <button id="payBtn">Pay Now</button>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    // Using localStorage to get project config (which should be set by jdh-firebase-modules but we will just fetch it)
    const firebaseConfig = JSON.parse(localStorage.getItem('jdh_firebase_config') || '{}');
    let db;
    if (firebaseConfig.apiKey) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    }
    
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get('reqId');
    const returnUrl = params.get('returnUrl') || 'parent-portal.html';
    
    if (!reqId) {
      document.getElementById('amountDisplay').innerText = "Invalid Request";
      document.getElementById('payBtn').style.display = 'none';
    } else {
      // Simulate fetching amount
      // Actually we need to make sure `db` is available. Let's just make it a dumb UI if no db.
      if (db) {
         getDoc(doc(db, 'enrollment_requests', reqId)).then(snap => {
           if (snap.exists()) {
             const data = snap.data();
             document.getElementById('amountDisplay').innerText = '₦' + (data.amount || 0).toLocaleString();
           }
         });
      }
    }
    
    document.getElementById('payBtn').addEventListener('click', async () => {
      const btn = document.getElementById('payBtn');
      btn.innerText = 'Processing...';
      btn.disabled = true;
      
      try {
        if (db && reqId) {
          const reqRef = doc(db, 'enrollment_requests', reqId);
          const reqSnap = await getDoc(reqRef);
          if (reqSnap.exists()) {
             const data = reqSnap.data();
             
             // 1. Mark request as paid
             await updateDoc(reqRef, { status: 'paid' });
             
             // 2. Create Payment record
             await addDoc(collection(db, 'payments'), {
               parentId: data.parentId,
               amount: data.amount,
               plan: data.plan,
               status: 'paid',
               createdAt: serverTimestamp(),
               reqId: reqId
             });
             
             // 3. Auto-Enrollment (Create Student Record)
             // Phase 3 MVP behavior: Create the student immediately
             const fakeCode = Math.random().toString(36).substring(2, 10).toUpperCase();
             await addDoc(collection(db, 'students'), {
                parentId: data.parentId,
                studentType: 'private',
                fullName: data.studentName,
                name: data.studentName,
                email: data.studentEmail,
                subjects: data.subjects,
                accessCode: fakeCode,
                createdAt: serverTimestamp(),
                plan: data.plan
             });
          }
        }
        
        btn.innerText = 'Success! Redirecting...';
        btn.style.background = '#10b981';
        setTimeout(() => { window.location.href = returnUrl; }, 1500);
      } catch(e) {
        alert("Payment Error: " + e.message);
        btn.innerText = 'Pay Now';
        btn.disabled = false;
      }
    });
  </script>

<script>
window.switchTab = function(name, btn) {
    console.log("Switching to tab:", name);
    document.querySelectorAll('.sidebar-menu .nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.tab-pane, .tab-content').forEach(p => p.classList.remove('active'));
    
    let targetBtn = btn || document.querySelector('.sidebar-menu .nav-item[data-tab="' + name + '"]');
    if(targetBtn) targetBtn.classList.add('active');
    
    // Some buttons might pass data-tab="null" but pass 'name' as first argument.
    // We try to find the button by onclick if we couldn't find it
    if(!targetBtn) {
        let allBtns = document.querySelectorAll('.sidebar-menu .nav-item');
        for(let i=0; i<allBtns.length; i++) {
            let attr = allBtns[i].getAttribute('onclick') || '';
            if(attr.includes("'" + name + "'")) {
                allBtns[i].classList.add('active');
                break;
            }
        }
    }
    
    const pane = document.getElementById(name);
    if(pane) pane.classList.add('active');
    
    document.querySelector('main')?.scrollTo(0, 0);
};
window.toggleSidebar = function() {
    const sb = document.getElementById('sidebar');
    if(sb) sb.classList.toggle('-translate-x-full');
};
</script>
