    body { font-family: system-ui, sans-serif; background: #f4f4f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .checkout-box { background: #fff; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 420px; width: 100%; border-top: 4px solid #0ba4db; }

    button:hover { background: #0883b0; transform: translateY(-1px); box-shadow: 0 6px 8px rgba(11, 164, 219, 0.3); }
    button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }

  <script src="https://js.paystack.co/v1/inline.js"></script>

    <script>
        const savedTheme = localStorage.getItem('jdh-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        
        window.toggleTheme = function() {
            const h = document.documentElement;
            const isDark = h.getAttribute('data-theme') === 'dark';
            const n = isDark ? 'light' : 'dark';
            h.setAttribute('data-theme', n);
            localStorage.setItem('jdh-theme', n);
            if (n === 'dark') h.classList.add('dark'); else h.classList.remove('dark');
        };
    </script>

<body>
  <div class="checkout-box">
    <div class="paystack-logo">Paystack Checkout</div>
    <h2>Complete Payment</h2>
    <div class="amount" id="amountDisplay">Loading...</div>
    <div class="student-info" id="studentInfo">Fetching details...</div>
    <button id="payBtn" disabled>Loading...</button>
    <div class="sandbox-notice" id="sandboxNotice"><strong>Sandbox Mode:</strong> Proceeding without actual Paystack API because test key is a placeholder.</div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyD_lq2Z4qBrZZkzYmEMPPMtCKQmfSx2rkY",
      authDomain: "jaystarbliss-studios.firebaseapp.com",
      projectId: "jaystarbliss-studios",
      storageBucket: "jaystarbliss-studios.firebasestorage.app",
      messagingSenderId: "885364100276",
      appId: "1:885364100276:web:1159c4cbd9159aaa0e1be1"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const reqId = params.get('reqId');
    const returnUrl = params.get('returnUrl') || 'parent-portal.html';
    
    let enrollmentData = null;

    // Replace this with your actual Paystack Public Key
    const PAYSTACK_PUBLIC_KEY = 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; 

    async function loadData() {
      if (!reqId) {
        document.getElementById('amountDisplay').innerText = "Invalid Request";
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'enrollment_requests', reqId));
        if (snap.exists()) {
          enrollmentData = snap.data();
          document.getElementById('amountDisplay').innerText = '₦' + (enrollmentData.amount || 0).toLocaleString();
          document.getElementById('studentInfo').innerText = `For ${enrollmentData.studentName} (${enrollmentData.plan})`;
          
          const btn = document.getElementById('payBtn');
          btn.innerText = 'Pay Now';
          btn.disabled = false;
        } else {
          document.getElementById('amountDisplay').innerText = "Request Not Found";
        }
      } catch(e) {
        console.error(e);
        document.getElementById('amountDisplay').innerText = "Error loading request";
      }
    }

    async function processSuccessfulPayment(reference) {
      const btn = document.getElementById('payBtn');
      btn.innerText = 'Processing...';
      btn.disabled = true;

      try {
         // 1. Mark enrollment request as paid
         await updateDoc(doc(db, 'enrollment_requests', reqId), { 
            status: 'paid',
            paymentRef: reference
         });
                      
         // 2. Create Payment record
         await addDoc(collection(db, 'payments'), {
           parentId: enrollmentData.parentId,
           amount: enrollmentData.amount,
           plan: enrollmentData.plan,
           status: 'paid',
           reference: reference,
           createdAt: serverTimestamp(),
           reqId: reqId
         });
                      
         btn.innerText = 'Success! Redirecting...';
         btn.style.background = '#10b981';
         setTimeout(() => { window.location.href = returnUrl; }, 1500);
      } catch (e) {
         alert("Database update failed: " + e.message + "\nYour payment was successful. Please contact admin.");
         btn.innerText = 'Pay Now';
         btn.disabled = false;
      }
    }

    document.getElementById('payBtn').addEventListener('click', () => {
      if (!enrollmentData) return;
      
      const parentEmail = localStorage.getItem('userEmail') || 'parent@example.com';

      // Fallback sandbox if key is not configured
      if (PAYSTACK_PUBLIC_KEY.includes('xxx')) {
        document.getElementById('sandboxNotice').style.display = 'block';
        setTimeout(() => {
          processSuccessfulPayment('sandbox_' + Math.floor((Math.random() * 1000000000) + 1));
        }, 1000);
        return;
      }

      const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY, 
        email: parentEmail,
        amount: enrollmentData.amount * 100, // in kobo
        currency: 'NGN',
        ref: '' + Math.floor((Math.random() * 1000000000) + 1), 
        metadata: {
           custom_fields: [
              {
                  display_name: "Student Name",
                  variable_name: "student_name",
                  value: enrollmentData.studentName
              },
              {
                  display_name: "Plan",
                  variable_name: "plan",
                  value: enrollmentData.plan
              }
           ]
        },
        callback: function(response) {
          processSuccessfulPayment(response.reference);
        },
        onClose: function() {
          alert('Transaction was not completed, window closed.');
        }
      });

      handler.openIframe();
    });

    loadData();
  </script>

<script>
window.switchTab = function(name, btn) {
    console.log("Switching to tab:", name);
    document.querySelectorAll('.sidebar-menu .nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.tab-pane, .tab-content').forEach(p => p.classList.remove('active'));
    
    let targetBtn = btn || document.querySelector('.sidebar-menu .nav-item[data-tab="' + name + '"]');
    if(targetBtn) targetBtn.classList.add('active');
    
    // Some buttons might pass data-tab="null" but pass 'name' as first argument.
    // We try to find the button by onclick if we couldn't find it
    if(!targetBtn) {
        let allBtns = document.querySelectorAll('.sidebar-menu .nav-item');
        for(let i=0; i<allBtns.length; i++) {
            let attr = allBtns[i].getAttribute('onclick') || '';
            if(attr.includes("'" + name + "'")) {
                allBtns[i].classList.add('active');
                break;
            }
        }
    }
    
    const pane = document.getElementById(name);
    if(pane) pane.classList.add('active');
    
    document.querySelector('main')?.scrollTo(0, 0);
};
window.toggleSidebar = function() {
    const sb = document.getElementById('sidebar');
    if(sb) sb.classList.toggle('-translate-x-full');
};
</script>
