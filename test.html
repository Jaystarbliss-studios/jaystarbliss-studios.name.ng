<!DOCTYPE html>
<html>
<head>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
.box {
  width: 50px; height: 50px; background: red;
  position: absolute; left: 50%;
  transform: translateX(-50%);
  animation: spin 5s linear infinite;
}
</style>
</head>
<body>
<div class="box"></div>
</body>
</html>
